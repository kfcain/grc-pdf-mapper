[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grc-pdf-mapper"
version = "0.1.0"
description = "GRC control extraction, framework crosswalk, and policy lineage from policy documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
pdf = ["pdf-inspector>=0.2"]
anydoc = ["firecrawl-anydoc>=0.1"]
# Full local ingest: PDF class/OCR hints + office formats (Word/Excel/…).
docs = ["pdf-inspector>=0.2", "firecrawl-anydoc>=0.1"]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[project.scripts]
grc-pdf = "grc_pdf_mapper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grc_pdf_mapper = ["py.typed", "**/*.json", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
