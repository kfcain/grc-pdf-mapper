name: Policy-as-Code Lock-Step

on:
  pull_request:
    paths:
      - "lab/iac/**"
      - "lab/policies/**"
      - "lab/policy-as-code-links.json"
      - "**/*.tf"
      - "policies/**"
      - "**/*policy*.md"
      - "**/*procedure*.md"
      - "**/*standard*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lockstep:
    name: Docs ↔ Terraform lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Detect change sides
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || github.sha }}"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA"...HEAD || true)
          TF_FILES=()
          DOC_FILES=()
          for f in "${CHANGED[@]}"; do
            if [[ "$f" == *.tf || "$f" == lab/iac/* ]]; then
              TF_FILES+=("$f")
            fi
            if [[ "$f" == lab/policies/* || "$f" == *policy*.md || "$f" == *procedure*.md || "$f" == *standard*.md ]]; then
              DOC_FILES+=("$f")
            fi
          done
          echo "tf_changed=${#TF_FILES[@]}" >> "$GITHUB_OUTPUT"
          echo "doc_changed=${#DOC_FILES[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#DOC_FILES[@]}" -gt 0 ]; then
            echo "doc_file=${DOC_FILES[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "doc_file=lab/policies/access-control.md" >> "$GITHUB_OUTPUT"
          fi
          printf 'Changed files:\n'; printf ' - %s\n' "${CHANGED[@]:-}"

      - name: Materialize complete base and head trees
        id: trees
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || github.sha }}"
          BASE_TF_ROOT="/tmp/pac/base-tf"
          HEAD_TF_ROOT="/tmp/pac/head-tf"
          mkdir -p "$BASE_TF_ROOT" "$HEAD_TF_ROOT"

          while IFS= read -r FILE; do
            if [[ "$FILE" != *.tf ]]; then
              continue
            fi
            mkdir -p "$BASE_TF_ROOT/$(dirname "$FILE")"
            git show "${BASE_SHA}:${FILE}" > "$BASE_TF_ROOT/$FILE"
          done < <(git ls-tree -r --name-only "$BASE_SHA")

          while IFS= read -r FILE; do
            mkdir -p "$HEAD_TF_ROOT/$(dirname "$FILE")"
            cp "$FILE" "$HEAD_TF_ROOT/$FILE"
          done < <(git ls-files '*.tf')

          FILE="${{ steps.detect.outputs.doc_file }}"
          if [ -f "$FILE" ]; then
            cp "$FILE" /tmp/pac/head-policy.md
          else
            printf '%s\n' '# Removed controlled document' > /tmp/pac/head-policy.md
          fi
          if git cat-file -e "${BASE_SHA}:${FILE}" 2>/dev/null; then
            git show "${BASE_SHA}:${FILE}" > /tmp/pac/base-policy.md
          else
            printf '%s\n' '# New controlled document' > /tmp/pac/base-policy.md
          fi

          echo "base_tf_root=$BASE_TF_ROOT" >> "$GITHUB_OUTPUT"
          echo "head_tf_root=$HEAD_TF_ROOT" >> "$GITHUB_OUTPUT"
          echo "base_policy=/tmp/pac/base-policy.md" >> "$GITHUB_OUTPUT"
          echo "head_policy=/tmp/pac/head-policy.md" >> "$GITHUB_OUTPUT"

      - name: Evaluate complete policy and Terraform change set
        id: evaluate
        continue-on-error: true
        run: |
          python scripts/ci_pac_sync.py \
            --mode change-set \
            --links lab/policy-as-code-links.json \
            --doc-id pol-ac-001 \
            --base-policy "${{ steps.trees.outputs.base_policy }}" \
            --head-policy "${{ steps.trees.outputs.head_policy }}" \
            --base-tf-root "${{ steps.trees.outputs.base_tf_root }}" \
            --head-tf-root "${{ steps.trees.outputs.head_tf_root }}" \
            --terraform-root "${{ steps.trees.outputs.head_tf_root }}" \
            --assessments lab/assessments.json \
            --fail-on high \
            --comment-out pac-comment.md \
            --json-out pac-alert.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: policy-as-code-lockstep
          path: |
            pac-comment.md
            pac-alert.json
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pac-comment.md')) {
              core.info('No pac-comment.md to post');
              return;
            }
            const body = '<!-- grc-pdf-mapper-pac -->\n' + fs.readFileSync('pac-comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- grc-pdf-mapper-pac -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce lock-step gate
        if: steps.evaluate.outcome == 'failure'
        run: |
          echo "::error::Documentation and policy-as-code are out of lock-step. Update both sides in the same PR."
          exit 1
