name: Policy-as-Code Lock-Step

on:
  pull_request:
    paths:
      - "lab/iac/**"
      - "lab/policies/**"
      - "lab/policy-as-code-links.json"
      - "**/*.tf"
      - "policies/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lockstep:
    name: Docs ↔ Terraform lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Detect change sides
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || github.sha }}"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA"...HEAD || true)
          TF_FILES=()
          DOC_FILES=()
          for f in "${CHANGED[@]}"; do
            if [[ "$f" == *.tf || "$f" == lab/iac/* ]]; then
              TF_FILES+=("$f")
            fi
            if [[ "$f" == lab/policies/* || "$f" == *policy*.md ]]; then
              DOC_FILES+=("$f")
            fi
          done
          echo "tf_changed=${#TF_FILES[@]}" >> "$GITHUB_OUTPUT"
          echo "doc_changed=${#DOC_FILES[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#TF_FILES[@]}" -gt 0 ]; then
            echo "tf_file=${TF_FILES[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "tf_file=lab/iac/access_control/main.tf" >> "$GITHUB_OUTPUT"
          fi
          if [ "${#DOC_FILES[@]}" -gt 0 ]; then
            echo "doc_file=${DOC_FILES[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "doc_file=lab/policies/access-control.md" >> "$GITHUB_OUTPUT"
          fi
          printf 'Changed files:\n'; printf ' - %s\n' "${CHANGED[@]:-}"

      - name: Completeness scan
        id: complete
        continue-on-error: true
        run: |
          python scripts/ci_pac_sync.py \
            --mode completeness \
            --links lab/policy-as-code-links.json \
            --policy lab/policies/access-control.md \
            --terraform-root lab/iac \
            --doc-id pol-ac-001 \
            --fail-on high \
            --comment-out pac-comment.md \
            --json-out pac-alert.json

      - name: IaC change → documentation prompt
        id: iac
        if: steps.detect.outputs.tf_changed != '0'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.detect.outputs.tf_file }}"
          mkdir -p /tmp/pac
          cp "$FILE" /tmp/pac/head.tf
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "${BASE_SHA}:${FILE}" 2>/dev/null; then
            git show "${BASE_SHA}:${FILE}" > /tmp/pac/base.tf
          else
            printf '# empty base\n' > /tmp/pac/base.tf
          fi
          python scripts/ci_pac_sync.py \
            --mode iac-changed \
            --links lab/policy-as-code-links.json \
            --policy lab/policies/access-control.md \
            --doc-id pol-ac-001 \
            --base-tf /tmp/pac/base.tf \
            --head-tf /tmp/pac/head.tf \
            --fail-on high \
            --comment-out pac-comment.md \
            --json-out pac-alert.json

      - name: Doc change → IaC verification prompt
        id: doc
        if: steps.detect.outputs.doc_changed != '0'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.detect.outputs.doc_file }}"
          mkdir -p /tmp/pac
          cp "$FILE" /tmp/pac/head.md
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "${BASE_SHA}:${FILE}" 2>/dev/null; then
            git show "${BASE_SHA}:${FILE}" > /tmp/pac/base.md
          else
            printf '# empty base\n' > /tmp/pac/base.md
          fi
          python scripts/ci_pac_sync.py \
            --mode doc-changed \
            --links lab/policy-as-code-links.json \
            --terraform-root lab/iac \
            --doc-id pol-ac-001 \
            --base-policy /tmp/pac/base.md \
            --head-policy /tmp/pac/head.md \
            --fail-on high \
            --comment-out pac-comment.md \
            --json-out pac-alert.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: policy-as-code-lockstep
          path: |
            pac-comment.md
            pac-alert.json
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pac-comment.md')) {
              core.info('No pac-comment.md to post');
              return;
            }
            const body = '<!-- grc-pdf-mapper-pac -->\n' + fs.readFileSync('pac-comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- grc-pdf-mapper-pac -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce lock-step gate
        if: steps.complete.outcome == 'failure' || steps.iac.outcome == 'failure' || steps.doc.outcome == 'failure'
        run: |
          echo "::error::Documentation and policy-as-code are out of lock-step. Update both sides in the same PR."
          exit 1
