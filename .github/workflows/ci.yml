name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lab simulation (expects blocked critical change)
        run: |
          set +e
          bash lab/simulate_risky_pr.sh
          RC=$?
          set -e
          if [ "$RC" -ne 1 ]; then
            echo "Expected exit code 1 from risky PR simulation, got $RC"
            exit 1
          fi
          echo "Lab simulation correctly blocked critical wording change."

      - name: Policy-as-code lock-step lab
        run: bash lab/simulate_pac_lockstep.sh
